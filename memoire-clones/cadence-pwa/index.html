<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Cadence</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Cadence</h1>
    <button id="btn-settings" class="icon" aria-label="Réglages">⚙︎</button>
  </header>

  <main>
    <!-- Recherche -->
    <section id="view-search" class="view active">
      <form id="search-form" class="search">
        <input id="search-input" type="search" placeholder="Titre, artiste, ou lien YouTube" autocomplete="off">
        <button type="submit">Chercher</button>
      </form>
      <p id="search-hint" class="hint"></p>
      <ul id="search-results" class="tracks"></ul>
    </section>

    <!-- Bibliothèque -->
    <section id="view-library" class="view">
      <h2>Titres sauvegardés</h2>
      <ul id="library-list" class="tracks"></ul>
    </section>

    <!-- Playlists -->
    <section id="view-playlists" class="view">
      <form id="playlist-form" class="search">
        <input id="playlist-name" placeholder="Nouvelle playlist" required>
        <button type="submit">Créer</button>
      </form>
      <ul id="playlists" class="cards"></ul>
      <div id="playlist-detail" hidden>
        <button id="playlist-back" class="link">← Playlists</button>
        <h2 id="playlist-title"></h2>
        <div class="row">
          <button id="playlist-play">Lire</button>
          <button id="playlist-shuffle">Aléatoire</button>
          <button id="playlist-delete" class="danger">Supprimer</button>
        </div>
        <ul id="playlist-tracks" class="tracks"></ul>
      </div>
    </section>

    <!-- File d'attente -->
    <section id="view-queue" class="view">
      <h2>File d'attente</h2>
      <ul id="queue-list" class="tracks"></ul>
    </section>
  </main>

  <!-- Lecteur : l'iframe YouTube reste visible (≥ 200×200 px, exigence des CGU de l'API) -->
  <aside id="player" class="player" hidden>
    <div id="yt-frame-wrap"><div id="yt-frame"></div></div>
    <div class="player-meta">
      <strong id="now-title"></strong>
      <span id="now-artist"></span>
      <input id="seek" type="range" min="0" max="100" value="0" aria-label="Position">
      <div class="controls">
        <button id="btn-shuffle" class="icon" aria-label="Aléatoire">⤮</button>
        <button id="btn-prev" class="icon" aria-label="Précédent">⏮</button>
        <button id="btn-play" class="icon big" aria-label="Lecture/Pause">▶</button>
        <button id="btn-next" class="icon" aria-label="Suivant">⏭</button>
        <button id="btn-repeat" class="icon" aria-label="Répéter">↻</button>
      </div>
    </div>
  </aside>

  <nav class="tabs">
    <button data-view="search" class="active">Recherche</button>
    <button data-view="library">Bibliothèque</button>
    <button data-view="playlists">Playlists</button>
    <button data-view="queue">File</button>
  </nav>

  <dialog id="settings">
    <form method="dialog">
      <h2>Réglages</h2>
      <label>Clé YouTube Data API v3 (pour la recherche)
        <input id="api-key" placeholder="AIza…">
      </label>
      <p class="hint">Sans clé : collez un lien ou un identifiant YouTube dans la recherche.</p>
      <div class="row">
        <button type="button" id="btn-export">Exporter la bibliothèque</button>
        <label class="button">Importer<input id="file-import" type="file" accept="application/json" hidden></label>
      </div>
      <button value="ok">Fermer</button>
    </form>
  </dialog>

  <dialog id="add-to-playlist">
    <form method="dialog">
      <h2>Ajouter à…</h2>
      <ul id="add-targets" class="plain"></ul>
      <button value="cancel">Annuler</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
