<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cadence</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scroller" class="scroller">
    <!-- Vues principales -->
    <section id="view-home" class="view" data-title="Accueil"></section>
    <section id="view-new" class="view" data-title="Nouveautés"></section>
    <section id="view-library" class="view" data-title="Bibliothèque"></section>
    <section id="view-search" class="view" data-title="Rechercher"></section>
    <!-- Vue empilée (playlist, genre, liste) -->
    <section id="view-detail" class="view"></section>
  </div>

  <!-- Barre flottante : mini-lecteur + onglets (verre dépoli) -->
  <div id="dock" class="dock">
    <div id="mini" class="mini glass">
      <div class="mini-art"></div>
      <div class="mini-title">À l'arrêt</div>
      <button class="mini-btn" data-act="toggle" aria-label="Lecture"></button>
      <button class="mini-btn dim" data-act="next" aria-label="Suivant"></button>
    </div>
    <div class="dock-row">
      <nav id="tabs" class="tabs glass"></nav>
      <button id="tab-search" class="tab-search glass" data-view="search" aria-label="Rechercher"></button>
    </div>
  </div>

  <!-- Vidéo flottante (CGU YouTube : lecteur visible ≥ 200×200 quand « À l'écoute » est fermé) -->
  <div id="float-video" class="float-video" hidden>
    <button class="float-close" aria-label="Arrêter"></button>
  </div>

  <!-- À l'écoute (plein écran) -->
  <div id="np" class="np" aria-hidden="true">
    <div class="np-bg"></div>
    <div class="np-inner">
      <button class="np-grabber" aria-label="Fermer"></button>
      <div id="np-stage" class="np-stage"><div id="np-art" class="np-art"></div></div>
      <div id="np-queue" class="np-queue" hidden></div>
      <div class="np-meta">
        <div class="np-text"><div id="np-title" class="np-title"></div><div id="np-artist" class="np-artist"></div></div>
        <button id="np-like" class="np-round" aria-label="Favori"></button>
        <button id="np-more" class="np-round" aria-label="Plus"></button>
      </div>
      <div class="np-scrub">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
        <div class="np-times"><span id="t-cur">0:00</span><span id="t-rem">-0:00</span></div>
      </div>
      <div class="np-ctrl">
        <button id="np-prev" aria-label="Précédent"></button>
        <button id="np-play" class="big" aria-label="Lecture"></button>
        <button id="np-next" aria-label="Suivant"></button>
      </div>
      <div class="np-vol"><span class="vol-ico lo"></span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"><span class="vol-ico hi"></span></div>
      <div class="np-bottom">
        <button id="np-shuffle" aria-label="Aléatoire"></button>
        <button id="np-repeat" aria-label="Répéter"></button>
        <button id="np-output" aria-label="Sortie audio"></button>
        <button id="np-list" aria-label="File d'attente"></button>
      </div>
    </div>
  </div>
  <div id="yt-host"><div id="yt-frame"></div></div>

  <!-- Feuille d'actions -->
  <div id="sheet" class="sheet" hidden><div class="sheet-panel"></div></div>

  <!-- Réglages -->
  <dialog id="settings">
    <form method="dialog">
      <h2>Cadence</h2>
      <p class="hint">Musique en streaming libre et gratuite via <b>Audius</b> — aucun compte, aucune clé. La lecture fonctionne en arrière-plan et écran verrouillé.</p>
      <div class="grouped">
        <button type="button" id="btn-export">Exporter la bibliothèque</button>
        <label class="as-button">Importer une bibliothèque<input id="file-import" type="file" accept="application/json" hidden></label>
      </div>
      <button value="ok" class="primary">Terminé</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
