# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Dans le dossier lumen-ios/ :  brew install xcodegen  puis  xcodegen generate  puis  open Lumen.xcodeproj
name: Lumen
options:
  bundleIdPrefix: com.exemple
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Extraction des flux YouTube (bibliothèque open source, MIT). Suit « main » : YouTube change souvent,
  # les correctifs d'extraction arrivent vite. Pour figer une version : remplacer par  from: "x.y.z".
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    branch: main
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    dependencies:
      - package: YouTubeKit
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Nécessaire à la lecture audio/vidéo écran verrouillé, en arrière-plan.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Le dossier « Téléchargements » de l'app est visible dans l'app Fichiers (Sur mon iPhone › Lumen).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exemple.lumen
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""   # Xcode le remplit automatiquement quand tu choisis ton compte
