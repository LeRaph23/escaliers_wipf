# Projet Xcode généré par XcodeGen. Dans cadence-ios/ :
#   brew install xcodegen  &&  xcodegen generate  &&  open Cadence.xcodeproj
name: Cadence
options:
  bundleIdPrefix: com.exemple
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence
      # L'interface web embarquée, ajoutée comme référence de dossier (bundle tel quel).
      - path: ../cadence-pwa
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exemple.cadence
        GENERATE_INFOPLIST_FILE: NO
        # Info.plist versionné, utilisé tel quel : XcodeGen ne le réécrit pas (sinon « git pull » bloque).
        INFOPLIST_FILE: Cadence/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
